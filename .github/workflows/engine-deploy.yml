name: Captionflow AI Engine Deploy

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - '.github/workflows/engine-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: captionflow-ai-engine-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate engine
        working-directory: engine
        run: |
          npm run check
          npm run self-test
      - name: Trigger Coolify deployment when configured
        shell: bash
        run: |
          if [[ -z "$COOLIFY_WEBHOOK" || -z "$COOLIFY_TOKEN" ]]; then
            echo "Coolify deployment skipped: COOLIFY_WEBHOOK / COOLIFY_TOKEN are not configured."
            exit 0
          fi
          curl --fail --show-error --silent --location \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_WEBHOOK}"
          echo "Coolify deploy webhook accepted."
